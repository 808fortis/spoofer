name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build
        run: |
          sed -i "s/^version=v.*/&-ci${{ github.run_number }}/" module/module.prop
          cargo ndk -t arm64-v8a -o module/zygisk build --release
          mv module/zygisk/arm64-v8a/libzygisk.so module/zygisk/arm64-v8a.so
          rm -rf module/zygisk/arm64-v8a
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk_spoof
          path: module/
