name: Build Zygisk Module

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build
        run: |
          cargo ndk -t arm64-v8a -o module/zygisk build --release
          mv module/zygisk/arm64-v8a/libzygisk.so module/zygisk/arm64-v8a.so
          rm -rf module/zygisk/arm64-v8a

        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Package module
        run: |
          cd module
          zip -r9 ../zygisk_spoof.zip . -x ".*" -x "*/.*"

      - uses: actions/upload-artifact@v4
        with:
          name: zygisk_spoof
          path: zygisk_spoof.zip
