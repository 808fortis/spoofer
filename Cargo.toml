[package]
name = "zygisk-spoof"
version = "1.0.0"
edition = "2021"

[lib]
name = "zygisk"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "*", features = ["derive"] }
serde_json = "*"
libc = "*"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
overflow-checks = false
